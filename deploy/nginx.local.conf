# Local development — lvh.me wildcard subdomain
# lvh.me সবসময় 127.0.0.1 এ resolve করে
# Usage: tenant1.lvh.me:8000

server {
    listen 80;
    server_name *.lvh.me;

    location / {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
