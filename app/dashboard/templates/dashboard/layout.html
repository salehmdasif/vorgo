<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard - Vorgo{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="h-full font-sans antialiased text-gray-900">
    <div class="min-h-full flex">
        <!-- Sidebar -->
        <div class="hidden md:flex md:w-64 md:flex-col md:fixed md:inset-y-0 bg-slate-900 border-r border-slate-800 text-white">
            <div class="flex-1 flex flex-col min-h-0">
                <div class="flex items-center h-16 flex-shrink-0 px-6 bg-slate-950 font-bold text-xl tracking-tight text-indigo-400">
                    Vorgo SaaS
                </div>
                <div class="flex-1 flex flex-col overflow-y-auto px-4 py-4 space-y-6">
                    <!-- Org Context -->
                    {% if org %}
                    <div class="px-3 py-2 bg-slate-800/60 rounded-lg border border-slate-700/50">
                        <div class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Workspace</div>
                        <div class="text-sm font-medium text-white truncate mt-0.5">{{ org.name }}</div>
                    </div>
                    {% endif %}
                    
                    <!-- Navigation -->
                    <nav class="flex-1 space-y-1">
                        <a href="/dashboard" class="flex items-center px-3 py-2 text-sm font-medium rounded-md hover:bg-slate-800 hover:text-white transition group {% if request.url.path == '/dashboard' %}bg-slate-800 text-white border-l-4 border-indigo-500{% else %}text-slate-300{% endif %}">
                            Overview
                        </a>
                        <a href="/dashboard/profile" class="flex items-center px-3 py-2 text-sm font-medium rounded-md hover:bg-slate-800 hover:text-white transition group {% if request.url.path == '/dashboard/profile' %}bg-slate-800 text-white border-l-4 border-indigo-500{% else %}text-slate-300{% endif %}">
                            Profile & 2FA
                        </a>
                        <a href="/dashboard/team" class="flex items-center px-3 py-2 text-sm font-medium rounded-md hover:bg-slate-800 hover:text-white transition group {% if request.url.path == '/dashboard/team' %}bg-slate-800 text-white border-l-4 border-indigo-500{% else %}text-slate-300{% endif %}">
                            Team Settings
                        </a>
                        <a href="/dashboard/billing" class="flex items-center px-3 py-2 text-sm font-medium rounded-md hover:bg-slate-800 hover:text-white transition group {% if request.url.path == '/dashboard/billing' %}bg-slate-800 text-white border-l-4 border-indigo-500{% else %}text-slate-300{% endif %}">
                            Billing & Subscriptions
                        </a>
                        
                        <div class="pt-4 border-t border-slate-800 my-4"></div>
                        
                        <a href="/docs/getting-started" class="flex items-center px-3 py-2 text-sm font-medium rounded-md text-slate-400 hover:bg-slate-800 hover:text-white transition">
                            Docs & Help
                        </a>
                        <a href="/blog/welcome" class="flex items-center px-3 py-2 text-sm font-medium rounded-md text-slate-400 hover:bg-slate-800 hover:text-white transition">
                            Our Blog
                        </a>
                    </nav>
                </div>
                
                <!-- User Profile Summary at bottom -->
                <div class="flex-shrink-0 flex bg-slate-950 p-4 border-t border-slate-800">
                    <div class="flex items-center w-full">
                        <div class="ml-3 truncate flex-1">
                            <p class="text-xs font-semibold text-slate-400">Signed in as</p>
                            <p class="text-sm font-medium text-white truncate">{{ user.email }}</p>
                        </div>
                        <a href="/logout" class="ml-2 p-1.5 text-slate-400 hover:text-white hover:bg-slate-800 rounded transition" title="Logout">
                            Logout
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="md:pl-64 flex flex-col flex-1">
            <main class="flex-1 py-10 px-4 sm:px-6 lg:px-8">
                {% block main_content %}{% endblock %}
            </main>
        </div>
    </div>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
