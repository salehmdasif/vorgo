{% extends "base.html" %}

{% block title %}Setup Workspace - Vorgo{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <h2 class="text-center text-3xl font-extrabold text-gray-900">Setup your workspace</h2>
        <p class="mt-2 text-center text-sm text-gray-600">
            Create an organization/workspace to start building.
        </p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10">
            {% if error %}
            <div class="mb-4 bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded text-sm">
                {{ error }}
            </div>
            {% endif %}

            <form action="/dashboard/setup-org" method="POST" class="space-y-6">
                <div>
                    <label for="org_name" class="block text-sm font-medium text-gray-700">Workspace / Org Name</label>
                    <div class="mt-1">
                        <input id="org_name" name="org_name" type="text" required placeholder="e.g. Acme Corp" class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                    </div>
                </div>

                <div>
                    <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">Create Workspace</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
