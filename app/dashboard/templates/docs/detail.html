<!DOCTYPE html>
<html lang="en" class="h-full bg-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ doc.metadata.title }} - Vorgo Docs</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full antialiased text-gray-900 bg-gray-50/50">
    <!-- Header -->
    <header class="sticky top-0 z-40 w-full flex-none bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="/dashboard" class="font-bold text-xl tracking-tight text-indigo-600">Vorgo SaaS</a>
            <div class="flex items-center space-x-4">
                <a href="/dashboard" class="text-sm font-medium text-gray-600 hover:text-indigo-600 transition">Go to Dashboard &rarr;</a>
            </div>
        </div>
    </header>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex">
        <!-- Sidebar Navigation -->
        <aside class="hidden lg:block w-64 pr-8 shrink-0">
            <nav class="space-y-6">
                <div>
                    <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Guides</h3>
                    <ul class="mt-3 space-y-2">
                        {% for d in docs_list %}
                        <li>
                            <a href="/docs/{{ d.slug }}" class="text-sm rounded-md transition duration-150 block py-1.5 {% if d.slug == doc.slug %}text-indigo-600 font-semibold{% else %}text-gray-600 hover:text-indigo-600{% endif %}">
                                {{ d.title }}
                            </a>
                        </li>
                        {% endfor %}
                    </ul>
                </div>
            </nav>
        </aside>

        <!-- Main Document Body -->
        <main class="flex-1 max-w-3xl lg:pl-8">
            <article class="prose prose-indigo max-w-none bg-white p-8 rounded-xl shadow-sm border border-gray-100">
                <p class="text-sm text-indigo-600 font-semibold mb-2 capitalize">Documentation Guide</p>
                <h1 class="text-3xl font-extrabold text-gray-900 mb-4">{{ doc.metadata.title }}</h1>
                <p class="text-sm text-gray-500 mb-8">{{ doc.metadata.description }}</p>
                
                <div class="text-gray-700 leading-relaxed space-y-6">
                    {{ doc.html | safe }}
                </div>
            </article>
        </main>
    </div>
</body>
</html>
