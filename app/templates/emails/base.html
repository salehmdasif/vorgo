<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333333; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #eeeeee; border-radius: 5px; }
        .header { text-align: center; margin-bottom: 20px; }
        .content { margin-bottom: 30px; }
        .footer { text-align: center; font-size: 12px; color: #777777; border-top: 1px solid #eeeeee; padding-top: 10px; }
        .button { display: inline-block; padding: 10px 20px; color: #ffffff; background-color: #007bff; border-radius: 4px; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>{{ app_name }}</h2>
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
        <div class="footer">
            <p>You received this email because you are registered at {{ app_name }}.</p>
        </div>
    </div>
</body>
</html>
