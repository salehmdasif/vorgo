name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: vorgo_test_db
          POSTGRES_USER: vorgo_user
          POSTGRES_PASSWORD: vorgo_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://vorgo_user:vorgo_pass@localhost:5432/vorgo_test_db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key
      ENVIRONMENT: test
      DEBUG: false
      ED25519_PRIVATE_KEY: ""
      ED25519_PUBLIC_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: |
          ruff check app/
          black --check app/

      - name: Run tests
        run: pytest tests/ -v --tb=short
